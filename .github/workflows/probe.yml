name: probe-link

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ensure clang + lld
        run: |
          which clang || (sudo apt-get update -qq && sudo apt-get install -y clang)
          sudo apt-get install -y lld
          clang --version
          which ld.lld || echo "no ld.lld"
          ld.lld --version 2>/dev/null || echo "ld.lld version n/a"

      - name: compile OC -> .o
        run: |
          set -e
          cat > hdr.h <<'EOF'
          typedef struct objc_class *Class;
          typedef struct objc_object *id;
          typedef struct objc_selector *SEL;
          typedef id (*IMP)(id, SEL, ...);
          id objc_getClass(const char*);
          SEL sel_registerName(const char*);
          id objc_msgSend(id, SEL, ...);
          void NSLog(id, ...);
          EOF
          cat > o.m <<'EOF'
          #include "hdr.h"
          __attribute__((constructor)) static void init(void){
              id c = objc_getClass("NSString");
              (void)objc_msgSend(c, sel_registerName("alloc"));
              NSLog(objc_msgSend(c, sel_registerName("stringWithUTF8String:"), "hi"));
          }
          int f(void){return 1;}
          EOF
          clang -target aarch64-apple-ios -c -ObjC -I. -o o.o o.m 2>&1 | head -20
          file o.o

      - name: link with lld (macho)
        run: |
          clang -target aarch64-apple-ios -miphoneos-version-min=14.0 -fuse-ld=lld \
                -dynamiclib -nostdlib -undefined dynamic_lookup -o o.dylib o.o 2>&1 | head -50 || true
          file o.dylib || echo "NO_OC_DYLIB"
          ls -la o.dylib 2>/dev/null || true

      - name: test lld adhoc codesign
        run: |
          set -e
          clang -target aarch64-apple-ios -miphoneos-version-min=14.0 -fuse-ld=lld \
                -dynamiclib -nostdlib -undefined dynamic_lookup -Wl,--adhoc-codesign \
                -o o2.dylib o.o 2>&1 | head -30 || true
          ls -la o2.dylib 2>/dev/null || echo "NO_o2"
          python3 - <<'PY'
          import struct
          data=open('o2.dylib','rb').read()
          magic=struct.unpack_from('<I',data,0)[0]
          if magic!=0xcffaedfe:
              print("not little-endian MH_MAGIC_64, magic=%x"%magic); raise SystemExit
          ncmds=struct.unpack_from('<I',data,16)[0]
          off=32
          found=False
          for i in range(ncmds):
              cmd,cmdsize=struct.unpack_from('<II',data,off)
              if cmd==0x1d:  # LC_CODE_SIGNATURE
                  found=True
                  print("LC_CODE_SIGNATURE present at off=%d"%off)
              off+=cmdsize
          print("AD-HOC SIGN OK" if found else "NO LC_CODE_SIGNATURE")
          PY
