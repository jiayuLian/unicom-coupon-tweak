name: probe-apple-target

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ensure clang
        run: |
          which clang || (sudo apt-get update -qq && sudo apt-get install -y clang)
          clang --version

      - name: cross compile aarch64-apple-ios (Mach-O)
        run: |
          printf 'int main(){return 0;}\n' | clang -target aarch64-apple-ios -c -o /tmp/t.o -x c -
          file /tmp/t.o
          echo "--- objdump header check ---"
          which llvm-objdump && llvm-objdump -h /tmp/t.o || true

      - name: python3 available
        run: python3 --version
