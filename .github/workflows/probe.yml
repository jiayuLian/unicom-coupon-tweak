name: probe-link

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ensure clang
        run: |
          which clang || (sudo apt-get update -qq && sudo apt-get install -y clang)
          clang --version

      - name: test pure-C link -> dylib
        run: |
          set -e
          printf 'int f(void){return 7;}\n__attribute__((constructor)) void i(void){}\n' > c.c
          clang -target aarch64-apple-ios -dynamiclib -undefined dynamic_lookup -o c.dylib c.c 2>&1 | head -40 || true
          file c.dylib || echo "NO_DYLIB"

      - name: test OC compile+link with bundled header
        run: |
          set -e
          cat > hdr.h <<'EOF'
          typedef struct objc_class *Class;
          typedef struct objc_object *id;
          typedef struct objc_selector *SEL;
          typedef id (*IMP)(id, SEL, ...);
          id objc_getClass(const char*);
          SEL sel_registerName(const char*);
          id objc_msgSend(id, SEL, ...);
          EOF
          cat > o.m <<'EOF'
          #include "hdr.h"
          __attribute__((constructor)) static void init(void){
              id c = objc_getClass("NSString");
              (void)objc_msgSend(c, sel_registerName("alloc"));
          }
          int f(void){return 1;}
          EOF
          clang -target aarch64-apple-ios -c -ObjC -I. -o o.o o.m 2>&1 | head -20
          file o.o
          clang -target aarch64-apple-ios -dynamiclib -undefined dynamic_lookup -o o.dylib o.o 2>&1 | head -40 || true
          file o.dylib || echo "NO_OC_DYLIB"
