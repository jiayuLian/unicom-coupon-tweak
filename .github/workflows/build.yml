name: Build couponhook dylib

on:
  workflow_dispatch:
    inputs:
      target_phone:
        description: '目标联通号 (券要给谁交费)'
        required: true
        default: '15629799900'
      target_city:
        description: '目标号归属地城市码 (724=湖北 110=天津 010=北京 ...)'
        required: true
        default: '724'
      target_phone_aes:
        description: '目标号 AES 密文 (frida_locate.py 算出; 留空=只改 phoneNo/cityCode)'
        required: false
        default: ''
  push:
    branches: [ main ]

jobs:
  build:
    # 免费 GitHub 账号私有仓库无 macOS runner; 改用 ubuntu + clang/lld 交叉编译 iOS arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          which clang || (sudo apt-get update -qq && sudo apt-get install -y clang)
          sudo apt-get install -y lld
          clang --version
          ld.lld --version 2>/dev/null || true

      - name: Build dylib (cross compile arm64-apple-ios)
        env:
          TARGET_PHONE: ${{ github.event.inputs.target_phone || '15629799900' }}
          TARGET_CITY: ${{ github.event.inputs.target_city || '724' }}
          TARGET_PHONE_AES: ${{ github.event.inputs.target_phone_aes || '' }}
        run: make

      - name: Sign dylib (ad-hoc, best-effort)
        run: python3 ldid_python.py couponhook.dylib || echo "sign skipped (TrollStore will re-sign on inject)"

      - name: Verify artifact
        run: |
          file couponhook.dylib
          python3 - <<'PY'
          import struct
          d=open('couponhook.dylib','rb').read()
          ncmds=struct.unpack_from('<I',d,16)[0]
          off=32; sig=False
          for _ in range(ncmds):
              cmd,cmdsize=struct.unpack_from('<II',d,off)
              if cmd==0x1d: sig=True
              off+=cmdsize
          print("Mach-O arm64 dylib, LC_CODE_SIGNATURE=%s" % sig)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: couponhook-dylib
          path: couponhook.dylib
